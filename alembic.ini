[alembic]
script_location = database/migrations
prepend_sys_path = .
version_path_separator = os

# sqlalchemy.url is intentionally omitted here — database/migrations/env.py
# sets it at runtime from backend.app.core.config.get_settings(), so the
# connection string (and its credentials) never lives in a tracked file.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
