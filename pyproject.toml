[project]
name = "locopilot"
version = "0.1.0"
description = "Autonomous AI software engineering agent."
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.30,<1.0",
    "alembic>=1.13,<2.0",
    "redis>=5.2,<6.0",
    "langchain-core>=0.3,<0.4",
    "langchain-openai>=0.2,<0.3",
    "langchain-google-genai>=2.1,<3.0",
    "langgraph>=0.2,<0.7",
    "pgvector>=0.3,<1.0",
    "structlog>=24.4,<25.0",
    "httpx>=0.27,<1.0",
    "python-multipart>=0.0.12,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "tools", "agents", "rag"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["backend/tests", "tests"]
# Domain classes named TestResult/TesterAgent aren't pytest test classes —
# pytest's name-based collection heuristic just thinks they might be.
filterwarnings = ["ignore::_pytest.warning_types.PytestCollectionWarning"]
