# Render Blueprint for the LocoPilot backend (FastAPI + Postgres/pgvector + Redis).
# The frontend is deployed separately on Vercel (see docs/DEPLOYMENT.md).
#
# Notes
# - Everything is on Render's free plans. Free web services sleep when idle
#   (first request after a pause takes ~1 minute) and free Postgres expires
#   after 30 days — upgrade the plans for anything beyond a demo.
# - Render web services have no Docker daemon, so LocoPilot's Docker sandbox
#   (isolated test runs and the live "Running Locally" preview) is NOT
#   available here. Code is still planned, written and reviewed.
# - Migrations run at start-up because pre-deploy commands need a paid plan.
databases:
  - name: locopilot-db
    plan: free
    databaseName: locopilot
    user: locopilot
    ipAllowList: []

services:
  - type: keyvalue
    name: locopilot-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  - type: web
    name: locopilot-api
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -e .
    startCommand: alembic upgrade head && uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: LOG_FORMAT
        value: json
      - key: LOCOPILOT_WORKSPACE_ROOT
        value: /tmp/locopilot
      # Browser origins allowed to call this API (the Vercel frontend).
      - key: CORS_ORIGINS
        value: https://loco-pilot.vercel.app,http://localhost:3000
      # Shared secret the frontend asks for. Generated by Render; read it in
      # the service's Environment tab and type it into the site once.
      - key: ACCESS_TOKEN
        generateValue: true
      - key: POSTGRES_HOST
        fromDatabase: { name: locopilot-db, property: host }
      - key: POSTGRES_PORT
        fromDatabase: { name: locopilot-db, property: port }
      - key: POSTGRES_USER
        fromDatabase: { name: locopilot-db, property: user }
      - key: POSTGRES_PASSWORD
        fromDatabase: { name: locopilot-db, property: password }
      - key: POSTGRES_DB
        fromDatabase: { name: locopilot-db, property: database }
      - key: REDIS_HOST
        fromService: { type: keyvalue, name: locopilot-redis, property: host }
      - key: REDIS_PORT
        fromService: { type: keyvalue, name: locopilot-redis, property: port }
      # --- LLM (secrets are entered in the Render dashboard, never committed) ---
      - key: LLM_PROVIDER
        value: nvidia
      - key: LLM_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: LLM_MODEL
        value: nvidia/nemotron-3.5-lightning-30b-a3b
      - key: PLANNER_MODEL
        value: nvidia/nemotron-3.5-lightning-30b-a3b
      - key: DEVELOPER_MODEL
        value: nvidia/nemotron-3.5-lightning-30b-a3b
      - key: DEBUGGER_MODEL
        value: nvidia/nemotron-3.5-lightning-30b-a3b
      - key: REVIEWER_MODEL
        value: nvidia/nemotron-3.5-lightning-30b-a3b
      - key: LLM_TEMPERATURE
        value: "0.2"
      - key: LLM_REQUEST_TIMEOUT
        value: "180"
      - key: LLM_API_KEY
        sync: false
      - key: EMBEDDING_PROVIDER
        value: openai_compatible
      - key: EMBEDDING_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: EMBEDDING_MODEL
        value: nvidia/nemotron-3-embed-1b
      - key: EMBEDDING_DIMENSION
        value: "2048"
      - key: EMBEDDING_API_KEY
        sync: false
